services:
  core-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swissquote
      POSTGRES_USER: swissquote
      POSTGRES_PASSWORD: "JDh53#bAcWztW&B*MPWc"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swissquote -d swissquote"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: core-postgres
      DB_PORT: 5432
      DB_NAME: swissquote
      DB_USER: swissquote
      DB_PASSWORD: "JDh53#bAcWztW&B*MPWc"
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-{baseUrl}/login/oauth2/code/{registrationId}}
      MOCK_AUTH_ENABLED: "true"
      AI_REMOTE_ENABLED: "true"
      AI_SERVICE_URL: http://ai-service:8080
      AI_SERVICE_TOKEN: local-ai-service-token
    expose:
      - "8080"
    depends_on:
      core-postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  ai-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swissquote_ai
      POSTGRES_USER: swissquote
      POSTGRES_PASSWORD: "JDh53#bAcWztW&B*MPWc"
    volumes:
      - ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swissquote -d swissquote_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      DB_PASSWORD: "JDh53#bAcWztW&B*MPWc"
      DB_USER: swissquote
      AI_DB_HOST: ai-postgres
      AI_DB_NAME: swissquote_ai
      AI_SERVICE_TOKEN: local-ai-service-token
    expose:
      - "8080"
    depends_on:
      ai-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/api-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q 'UP'"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  load-balancer:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q 'UP'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  ai-postgres-data:
