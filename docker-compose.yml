services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-swissquote}
      POSTGRES_USER: ${DB_USER:-swissquote}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in gradle.properties}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swissquote -d swissquote"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-swissquote}
      DB_USER: ${DB_USER:-swissquote}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in gradle.properties}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-{baseUrl}/login/oauth2/code/{registrationId}}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/api-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "80"

  load-balancer:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
      - backend
      - frontend

volumes:
  postgres-data:
