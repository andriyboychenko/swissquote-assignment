spring:
  config:
    import: optional:file:./gradle.properties,optional:file:../gradle.properties
  application:
    name: swissquote-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swissquote}
    username: ${DB_USER:swissquote}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.sql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration: {}

server:
  forward-headers-strategy: framework

app:
  ai:
    remote-enabled: ${AI_REMOTE_ENABLED:false}
    service-url: ${AI_SERVICE_URL:http://localhost:8082}
    service-token: ${AI_SERVICE_TOKEN:local-ai-service-token}
  auth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
    mock:
      enabled: ${MOCK_AUTH_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
